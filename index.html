<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>正修逐夢踏實｜升學魔法森林大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== 視覺系統：魔法學院（夜藍＋古金＋羊皮紙） ===== */
:root{
  --night:#0E1330; --night2:#1A2150; --win:rgba(14,19,48,.93); --win2:#212A5E;
  --gold:#E9C46A; --gold2:#F6DF9C; --gold-d:#9C7424; --parch:#F3E5C4; --ink:#3B2A17;
  --cyan:#7FE3E8; --red:#FF6B7A; --green:#5FD68E; --yel:#FFD166;
  --text:#F5EFDF; --muted:#BAB7D3;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","Noto Sans TC",serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--night:#0E1330}}
:root[data-theme="dark"]{--night:#0E1330}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--night);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--text);font-family:var(--sans);line-height:1.6;background:transparent;-webkit-tap-highlight-color:transparent}
.forestbg{position:fixed;inset:0;z-index:-2;background:#0B1A26}
.forestbg svg{position:absolute;inset:0;width:100%;height:100%}
.forestbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,20,24,0) 30%,rgba(8,20,24,.55) 75%,rgba(8,20,24,.8) 100%)}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.mist{animation:drift 14s ease-in-out infinite alternate}
.sparks{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.sparks i{position:absolute;width:4px;height:4px;border-radius:50%;background:#DFFF8A;box-shadow:0 0 10px #C8FF5A;animation:float var(--d) linear infinite;opacity:0}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-110vh);opacity:0}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,a:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--cyan);outline-offset:3px}
svg{max-width:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
/* 魔法視窗 */
.win{background:var(--win);border:2px solid var(--gold);border-radius:12px;padding:14px 16px;margin:0 0 14px;position:relative;
  box-shadow:inset 0 0 0 4px rgba(14,19,48,.9),inset 0 0 0 5px rgba(233,196,106,.45),0 8px 24px rgba(0,0,0,.45)}
.win::before,.win::after{content:"✦";position:absolute;color:var(--gold);font-size:12px;top:-9px;left:12px;background:var(--night);padding:0 4px;border-radius:4px}
.win::after{left:auto;right:12px}
.win h2{font-family:var(--kai);font-size:24px;font-weight:700;margin:0 0 6px;color:var(--gold2);letter-spacing:.04em}
.win h3{font-family:var(--kai);font-size:19px;font-weight:700;margin:0 0 6px;color:var(--gold2)}
.win p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:900;font-size:17px;font-family:var(--sans);
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#C99A3C);color:#2E1F05;box-shadow:0 5px 0 var(--gold-d),0 0 18px rgba(233,196,106,.25);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
.btn.sub{background:var(--win2);color:var(--text);border:2px solid var(--gold);box-shadow:0 4px 0 rgba(0,0,0,.45)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1}
.appear{animation:pop .25s both}
/* HUD */
.hud{position:sticky;top:0;z-index:30;padding:8px 10px;background:rgba(14,19,48,.95);border-bottom:2px solid rgba(233,196,106,.5);backdrop-filter:blur(6px)}
.hud[hidden]{display:none}
.hud .l1{display:flex;align-items:center;gap:8px}
.hud .ib{height:32px;flex:0 0 auto;min-width:32px;padding:0 10px;border-radius:16px;background:var(--win2);border:1.5px solid rgba(233,196,106,.6);font-size:13px;white-space:nowrap}
.hud .av{width:32px;height:32px;border-radius:50%;overflow:hidden;border:2px solid var(--cyan);flex:0 0 auto;background:var(--win2)}
.hud .av img{width:100%;height:100%;object-fit:cover;display:block}
.hud .pw{flex:1;min-width:60px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.hud .bar{flex:1;height:10px;border-radius:6px;background:#2A3164;overflow:hidden}
.hud .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF9F43);width:0;transition:width .5s}
.slots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.slot{min-width:0;padding:0;aspect-ratio:1;border-radius:7px;border:1.5px dashed rgba(233,196,106,.3);display:grid;place-items:center;font-size:15px;position:relative;filter:grayscale(1);opacity:.4}
.slot.can{opacity:.8;border-color:rgba(233,196,106,.7)}
.slot.got{filter:none;opacity:1;border:2px solid var(--gold);background:rgba(233,196,106,.2);box-shadow:0 0 8px rgba(233,196,106,.5)}
.slot.no::after{content:"🔒";position:absolute;font-size:9px;right:-2px;bottom:-3px;filter:none}
.slotlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}
.slotlab b{color:var(--gold)}
#scene{padding:16px 12px 28px}
#scene.talking{padding-bottom:300px}
/* 對話：導航員在上、你的答案在下 */
#dlg{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);z-index:40;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));display:none}
#dlg.show{display:block}
.talk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:0 0 8px;border-color:var(--sp)}
.talk .pic{flex:0 0 64px;height:64px;border-radius:50%;overflow:hidden;border:3px solid var(--sp);background:#1B2550;box-shadow:0 0 12px var(--sp)}
.talk .pic svg,.talk .pic img{display:block;width:100%;height:100%;object-fit:cover}
.talk .body{flex:1;min-width:0}
.talk .name{display:inline-block;background:var(--sp);color:#17112A;font-weight:900;font-size:13px;padding:1px 10px;border-radius:6px;margin-bottom:4px}
.talk .txt{font-family:var(--kai);font-size:clamp(17px,4.4vw,19px);line-height:1.65;min-height:3.3em}
.talk .more{position:absolute;right:14px;bottom:6px;color:var(--sp);font-size:13px;animation:nod 1s ease-in-out infinite}
.talk .skip{position:absolute;right:10px;top:8px;font-size:12px;color:var(--muted);padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.08)}
@keyframes nod{50%{transform:translateY(3px)}}
#dlg[data-who="guide"]{--sp:var(--gold)} #dlg[data-who="me"]{--sp:var(--cyan)} #dlg[data-who="sys"]{--sp:#D9D3FF}
#dlg[data-who="b1"],#dlg[data-who="b2"],#dlg[data-who="b3"],#dlg[data-who="fog"]{--sp:var(--red)}
#dlg[data-who^="b"] .txt,#dlg[data-who="fog"] .txt{color:#FFD6DC;font-weight:700}
.cmd{display:none;margin:0}
.cmd.show{display:block;animation:pop .2s both}
.cmd .ttl{display:inline-block;background:var(--cyan);color:#05262A;font-weight:900;font-size:13px;padding:2px 14px;border-radius:8px 8px 0 0;margin-left:12px}
.cmd .win{margin:0;border-color:var(--cyan);padding:8px;max-height:44vh;overflow-y:auto}
.cmd .win::before,.cmd .win::after{color:var(--cyan)}
.choice{display:grid;grid-template-columns:18px 28px 1fr;width:100%;text-align:left;gap:6px;align-items:start;padding:10px 8px;border-radius:8px;font-size:16px;font-weight:700;color:var(--text)}
.choice .cur{color:var(--cyan);visibility:hidden}
.choice .ic{text-align:center;font-size:19px;line-height:1.3}
.choice:hover,.choice:focus-visible{background:rgba(127,227,232,.14);outline:none}
.choice:hover .cur,.choice:focus-visible .cur{visibility:visible}
.choice[aria-pressed="true"]{background:rgba(127,227,232,.24)}
.choice[aria-pressed="true"] .cur{visibility:visible}
.choice.multi .cur{visibility:visible;width:18px;height:18px;border:2px solid var(--cyan);border-radius:5px;color:transparent;font-size:12px;display:grid;place-items:center;margin-top:3px}
.choice.multi[aria-pressed="true"] .cur{background:var(--cyan);color:#05262A}
.choice small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.cmdfoot{display:flex;gap:8px;padding:8px 4px 2px}
.cmdfoot .btn{flex:1;padding:9px 12px;font-size:15px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
/* 標題 */
.title{text-align:center;padding:10px 4px}
.title .crest{font-size:13px;color:var(--gold2);letter-spacing:.25em}
.title h1{font-family:var(--kai);font-size:clamp(42px,12vw,66px);line-height:1.1;margin:8px 0 4px;color:var(--gold2);text-shadow:0 0 22px rgba(233,196,106,.6),0 3px 0 #6E4E10}
.title .t2{font-family:var(--kai);font-size:20px;letter-spacing:.35em;color:var(--parch)}
.hero{margin:14px auto;border-radius:14px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 30px rgba(233,196,106,.35);aspect-ratio:3/2;background:center/cover no-repeat}
.tagline{font-family:var(--kai);font-size:19px}
/* 夥伴選擇 */
.avs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.avc{border-radius:14px;padding:8px 6px;background:var(--win2);border:2px solid rgba(233,196,106,.4);text-align:center;font-size:13px;font-weight:700}
.avc .ph{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid var(--gold);margin-bottom:6px;background:#2A3164;display:grid;place-items:center;font-size:34px}
.avc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.avc[aria-pressed="true"]{border-color:var(--cyan);background:rgba(127,227,232,.18);box-shadow:0 0 14px rgba(127,227,232,.5)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;left:-9999px}
.camopts{display:grid;gap:8px;margin-top:12px}
.camopts label.btn{cursor:pointer}
.camv{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid var(--gold);background:#000;transform:scaleX(-1)}
.token{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 3px var(--cyan),0 4px 10px rgba(0,0,0,.5);transition:left .55s ease,top .55s ease;pointer-events:none;z-index:2;background:#2A3164}
.token img{width:100%;height:100%;object-fit:cover;display:block}
.picked{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.picked .ph{width:120px;height:120px;border-radius:50%;overflow:hidden;border:4px solid var(--gold);box-shadow:0 0 24px rgba(233,196,106,.6);animation:pop .35s both}
.picked .ph img{width:100%;height:100%;object-fit:cover}
.book .bk{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px;border-radius:10px;background:var(--win2);margin-bottom:8px;border-left:6px solid var(--c)}
.book .bk .ic{font-size:30px;text-align:center}
.book .bk b{font-family:var(--kai);font-size:19px;color:var(--gold2)}
.book .bk p{margin:2px 0;font-size:14px}
.tabs{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:999px;border:2px solid var(--gold);font-weight:700;font-size:14px}
.tab[aria-pressed="true"]{background:var(--gold);color:#2E1F05}
.ycal{overflow-x:auto}
.ycal table{border-collapse:collapse;font-size:11px;min-width:820px;width:100%}
.ycal th,.ycal td{border:1px solid rgba(233,196,106,.25);padding:3px 2px;text-align:center;vertical-align:top}
.ycal th{white-space:nowrap;color:var(--gold2)} .ycal th.now{background:var(--cyan);color:#05262A}
.ycal td.lab{text-align:left;white-space:nowrap;font-weight:700;padding:3px 6px;position:sticky;left:0;background:var(--night)}
.ycal .mk{display:block;border-radius:4px;color:#17112A;font-weight:700;padding:1px;margin:1px 0}
.gong{position:relative;height:34px;border-radius:18px;background:#2A3164;border:2px solid var(--gold);overflow:hidden;margin:12px 0}
.gong .zone{position:absolute;top:0;bottom:0;left:40%;width:20%;background:rgba(95,214,142,.45)}
.gong .nd{position:absolute;top:2px;bottom:2px;width:8px;margin-left:-4px;border-radius:4px;background:#fff;box-shadow:0 0 8px #fff}
.fling{position:relative;height:270px;margin:0 6px;border-radius:12px;background:radial-gradient(circle at 50% 60%,rgba(78,143,91,.35),transparent 70%);overflow:hidden;touch-action:none}
.thought{position:absolute;padding:10px 14px;border-radius:18px;background:#F3E5C4;color:#3B2A17;font-weight:900;font-family:var(--kai);font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.35);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;white-space:nowrap}
.thought.gone{transition:transform .5s ease-in,opacity .5s;opacity:0}
.ffield{position:relative;height:260px;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#2B3B5A,#141C33)}
.ffield canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ffly{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center;font-size:24px;animation:pop .2s both;z-index:2}
.ffly::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#E8FF8A;box-shadow:0 0 18px 8px rgba(214,255,110,.75)}
.avm{width:64px;height:64px;border-radius:50%;overflow:hidden;border:3px solid var(--cyan);flex:0 0 auto}
.avm img{width:100%;height:100%;object-fit:cover;display:block}
.tl{position:relative;margin:6px 0 4px 8px;padding-left:18px;border-left:3px solid rgba(233,196,106,.5)}
.tli{position:relative;padding:6px 0 10px}
.tli::before{content:"";position:absolute;left:-26px;top:10px;width:13px;height:13px;border-radius:50%;background:var(--night);border:3px solid var(--gold)}
.tli.past{opacity:.5}.tli.past::before{background:var(--gold);border-color:var(--gold)}
.tli.now::before{background:var(--red);border-color:var(--red);box-shadow:0 0 10px var(--red)}
.tli.next::before{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.tli .d{font-weight:900;color:var(--gold2);font-size:15px}
.tli .w{font-weight:900;font-size:16px}
.tli .h{font-size:13px;color:var(--muted)}
.tli .s{display:inline-block;font-size:12px;font-weight:900;border-radius:999px;padding:0 8px;margin-left:4px;vertical-align:1px}
.tli.now .s{background:var(--red);color:#fff}.tli.next .s{background:var(--cyan);color:#05262A}.tli.past .s{background:rgba(255,255,255,.15)}
.card .tl{border-left-color:#C9A75A}
.card .tli::before{background:#FFFDF6;border-color:#9C7424}
.card .tli.past::before{background:#9C7424}
.card .tli .d{color:#8A5A00}.card .tli .w{color:#2A1A08}.card .tli .h{color:#6B5A3C}
.card .tli.next .s{background:#1A6E73;color:#fff}.card .tli.past .s{background:#E5D9BC;color:#2A1A08}
.sblk .sh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sblk .sq{width:84px;flex:0 0 84px;background:#fff;border-radius:8px;padding:4px}
.sblk .sq svg{width:100%;height:auto;display:block}
.hl{color:#FFD166;font-size:1.18em;text-shadow:0 0 10px rgba(255,209,102,.7)}
@media(max-width:420px){.hud .pw>span:first-child{display:none}}
/* 狀態 */
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:15px}
.stat div{padding:6px 2px;border-bottom:1px dashed rgba(233,196,106,.25)}
.stat .v{text-align:right;font-weight:700}
.ok{color:var(--green)} .mid{color:var(--yel)} .no{color:var(--muted)}
.pill{display:inline-block;white-space:nowrap;font-size:13px;font-weight:700;border-radius:999px;padding:1px 10px;margin:2px 4px 2px 0;border:1.5px solid currentColor}
.pill.g{color:var(--green)} .pill.y{color:var(--yel)} .pill.r{color:var(--red)} .pill.x{color:var(--cyan)}
/* 地圖：羊皮紙 */
.mapwin{padding:8px}
.map{position:relative;border-radius:10px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node:focus-visible .ring{stroke:#1A6E73;stroke-width:6}
.node .lab{font-family:var(--kai);font-size:16px;font-weight:700;fill:#3B2A17;paint-order:stroke;stroke:#F3E5C4;stroke-width:4px}
.fogcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .8s}
.fogtip{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(14,19,48,.88);border:2px solid var(--gold);border-radius:12px;padding:10px 14px;text-align:center;font-weight:700;pointer-events:none;transition:opacity .5s}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);padding:6px 6px 2px}
/* 橫幅 */
.banner{position:fixed;left:0;right:0;top:38%;z-index:60;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
.banner.show{opacity:1}
.banner div{display:inline-block;background:var(--win);border:2px solid var(--gold);border-radius:14px;padding:12px 26px;box-shadow:0 0 0 5px rgba(14,19,48,.9),0 0 50px rgba(233,196,106,.55)}
.banner small{display:block;color:var(--muted);font-size:13px}
.banner b{font-family:var(--kai);font-size:30px;color:var(--gold2)}
/* 任務卷軸 */
.quest .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.qrow{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:9px 0;border-top:1px dashed rgba(233,196,106,.25)}
.qrow>div{min-width:0}
.qrow .n{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#2E1F05;font-weight:900;display:grid;place-items:center;font-size:14px}
.qrow h4{margin:0 0 3px;font-size:14px;color:var(--muted);font-weight:700}
.qrow p{margin:0;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border-radius:8px;padding:2px 8px;background:var(--win2);border:1px solid rgba(233,196,106,.35)}
.count{display:inline-block;background:var(--win2);border:2px solid var(--gold);border-radius:10px;padding:6px 10px;font-size:14px;margin-bottom:6px}
.count b{color:var(--gold2);font-size:20px}
.track{display:flex;overflow-x:auto;padding:4px 0 2px}
.track .s{flex:0 0 auto;min-width:82px;text-align:center;font-size:12px;position:relative;padding-top:18px;color:var(--muted)}
.track .s::before{content:"";position:absolute;top:6px;left:0;right:0;height:3px;background:rgba(233,196,106,.35)}
.track .s::after{content:"";position:absolute;top:1px;left:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--night);border:3px solid var(--gold)}
.track .s b{display:block;color:var(--text);font-size:13px}
.track .s.now::after{background:var(--cyan);border-color:var(--cyan)}
.track .s.past{opacity:.4}
/* 小遊戲 */
.game{text-align:center}
.game .q{font-size:19px;font-weight:900;margin:8px 0 12px;line-height:1.45}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{font-size:44px;font-weight:900;border-radius:14px;padding:12px 0;background:var(--win2);border:2px solid var(--gold)}
.timer{height:8px;border-radius:5px;background:#2A3164;overflow:hidden;margin:6px 0}
.timer i{display:block;height:100%;background:var(--cyan);width:100%}
.gopts{display:grid;gap:8px;text-align:left}
.gopt{display:grid;grid-template-columns:26px 1fr;gap:6px;padding:12px 12px;border-radius:10px;background:var(--win2);border:2px solid rgba(233,196,106,.45);font-size:16px;font-weight:700}
.gopt.right{border-color:var(--green);background:rgba(95,214,142,.18)}
.gopt.wrong{border-color:var(--red);background:rgba(255,107,122,.16);animation:shake .35s}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{padding:12px 8px;border-radius:10px;background:var(--win2);border:2px solid rgba(233,196,106,.45);font-weight:700;font-size:15px;position:relative;min-height:56px}
.tile.done{border-color:var(--green);background:rgba(95,214,142,.16)}
.tile .no{position:absolute;top:-9px;left:-6px;background:var(--green);color:#05261A;border-radius:50%;width:24px;height:24px;font-size:13px;display:grid;place-items:center;font-weight:900}
.tile.bad{animation:shake .35s;border-color:var(--red)}
.card1{display:inline-block;padding:14px 18px;border-radius:10px;background:var(--parch);color:var(--ink);font-family:var(--kai);font-weight:700;font-size:20px;margin:6px 0 14px;box-shadow:0 6px 0 rgba(0,0,0,.35);animation:pop .25s both}
.bins{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.bin{padding:12px 6px;border-radius:12px;border:2px solid var(--gold);background:var(--win2);font-weight:900;font-size:15px}
.fb{min-height:2.6em;margin-top:10px;font-size:15px}
.fb.good{color:var(--green)} .fb.bad{color:#FFB0B9}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stars{font-size:30px;letter-spacing:4px;color:var(--gold2);text-shadow:0 0 12px var(--gold)}
/* 手機互動 */
.meter{height:18px;border-radius:10px;background:#2A3164;border:2px solid var(--gold);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#B8F7FF);transition:width .12s}
.live{height:28px;display:flex;gap:3px;justify-content:center;align-items:flex-end;margin:6px 0}
.live i{width:6px;background:var(--cyan);border-radius:3px;height:4px;transition:height .08s}
.hold{user-select:none;-webkit-user-select:none;touch-action:manipulation}
/* 入場券 */
.tk{position:relative;border-radius:12px;padding:14px 16px;color:#2A1A08;background:linear-gradient(135deg,var(--parch),#E7D3A4);display:grid;grid-template-columns:1fr auto;gap:10px;box-shadow:0 6px 0 rgba(0,0,0,.35);overflow:hidden;margin:8px 0;border:2px solid var(--c)}
.tk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c)}
.tk>div{position:relative;z-index:1}
.tk .t0{font-size:12px;font-weight:700;opacity:.75}
.tk .t1{font-family:var(--kai);font-size:26px;font-weight:700;line-height:1.15}
.tk .t2{font-size:13px;font-weight:700}
.tk .stub{border-left:2px dashed rgba(42,26,8,.4);padding-left:12px;display:grid;place-items:center;text-align:center;font-size:30px}
.tk .stub .seal{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E05A4E,#9E2A22);display:grid;place-items:center;font-size:22px;box-shadow:0 2px 0 #5E160F}
.tk .stub small{display:block;font-size:12px;font-weight:900;color:#9C7424}
.tk.mini{padding:10px 12px}.tk.mini .t1{font-size:19px}
.tk button{margin-top:6px;background:#2A1A08;color:#fff;border-radius:8px;font-size:13px;font-weight:700;padding:3px 10px}
.reveal{position:fixed;inset:0;z-index:70;background:rgba(8,10,28,.95);display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column;overflow-y:auto}
.reveal.show{display:flex}
.reveal .inner{width:min(420px,100%);text-align:center}
.flip{perspective:900px;margin:10px 0;position:relative}
.flip .fc{position:relative;animation:flip .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes flip{from{transform:rotateY(180deg) scale(.6)}to{transform:none}}
.rays{position:absolute;inset:-70px;background:conic-gradient(from 0deg,transparent 0 10deg,rgba(233,196,106,.28) 10deg 20deg,transparent 20deg 30deg);border-radius:50%;animation:spin 8s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
/* 戰鬥 */
.battle{text-align:center}
.arena{position:relative;height:220px;border-radius:10px;background:radial-gradient(60% 55% at 50% 65%,rgba(150,70,200,.45),transparent 70%);display:grid;place-items:center}
.arena .mon{width:170px;height:170px;filter:drop-shadow(0 0 16px rgba(255,107,122,.55));animation:hover 2.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-8px)}}
.arena .mon.hit{animation:hit .5s}
.arena .mon.atk{animation:atk .5s}
@keyframes hit{20%{transform:translateX(-12px);filter:brightness(3)}40%{transform:translateX(12px)}60%{transform:translateX(-6px);filter:brightness(2)}}
@keyframes atk{40%{transform:scale(1.25) translateY(16px)}}
.dmg{position:absolute;left:50%;top:28%;font-size:32px;font-weight:900;color:var(--gold2);text-shadow:0 3px 0 #000,0 0 14px var(--gold);animation:dmg 1.1s both;pointer-events:none;white-space:nowrap}
@keyframes dmg{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
.hpbox{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px;font-weight:700;text-align:left}
.hp{height:12px;border-radius:6px;background:#2A3164;overflow:hidden;border:2px solid var(--gold)}
.hp i{display:block;height:100%;background:var(--red);transition:width .6s}
.hearts{font-size:18px;letter-spacing:2px}
.shakeall{animation:shake .4s}
.flash{position:fixed;inset:0;background:#FFF4D0;z-index:80;pointer-events:none;animation:fl .4s both}
@keyframes fl{from{opacity:.85}to{opacity:0}}
/* 雷達、策略、攻略卡 */
.rlist{display:grid;gap:6px}
.rli{display:grid;grid-template-columns:24px 1fr;gap:6px;font-size:15px;padding:6px 8px;border-radius:8px;background:var(--win2)}
.medal{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--win2);margin-bottom:8px}
.medal .m{font-size:30px}
.medal label{font-size:13px;color:var(--muted);font-weight:700}
.medal select{width:100%;font:inherit;font-weight:700;font-size:16px;padding:8px;border-radius:8px;background:var(--night);color:var(--text);border:2px solid var(--gold)}
.warn{border:2px solid var(--red);border-radius:10px;padding:10px 12px;font-size:14px;background:rgba(255,107,122,.1)}
.card{color-scheme:light;background:var(--parch);color:#2A1A08;border-radius:14px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.card .hd{background:var(--night);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center}
.card .hd .avb{width:60px;height:60px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);flex:0 0 auto;background:#2A3164}
.card .hd .avb img{width:100%;height:100%;object-fit:cover}
.card .hd b{font-family:var(--kai);font-size:23px;color:var(--gold2);display:block}
.card .bd{padding:14px 16px}
.card h3{font-family:var(--kai);font-size:18px;margin:14px 0 6px;color:#2A1A08;border-left:6px solid #9E2A22;padding-left:8px}
.card .pill{color:#2A1A08}
.pgrp{background:rgba(255,255,255,.55);border-radius:10px;padding:8px 10px;margin:6px 0}
.pgrp b{font-size:14px}
.checks label{display:flex;gap:8px;font-size:15px;padding:2px 0}
.checks input{width:18px;height:18px;margin-top:4px;accent-color:#9E2A22;flex:0 0 auto}
.cal{overflow-x:auto}
.cal table{border-collapse:collapse;font-size:12px;min-width:540px;width:100%}
.cal th{white-space:nowrap;min-width:46px}
.cal th,.cal td{border:1px solid #CDB98C;padding:3px 2px;text-align:center;vertical-align:top}
.cal th.now{background:#9E2A22;color:#fff}
.cal td.lab{text-align:left;white-space:nowrap;font-weight:700;padding:3px 6px}
.cal .mk{display:block;border-radius:5px;color:#2A1A08;font-weight:700;padding:1px 2px;margin:1px 0;font-size:11px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.qr{border:2px solid #2A1A08;border-radius:10px;padding:6px;text-align:center;font-size:12px;font-weight:700;background:#fff;color:#2A1A08}
.qr svg{width:100%;height:auto;display:block}
.qr a{color:#2A1A08;font-weight:400;font-size:10px;word-break:break-all}
.disc{font-size:13px;color:var(--muted);margin-top:8px}
.card .disc{color:#6B5A3C}
.modal{position:fixed;inset:0;z-index:75;background:rgba(8,10,28,.82);display:none;align-items:flex-start;justify-content:center;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 18px;overflow-y:auto}
.modal.open{display:flex}
.modal .win{width:min(480px,100%);margin:auto 0}
.qrbig{max-width:210px;margin:6px auto;background:#fff;border-radius:10px;padding:8px}
.kv{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;font-size:15px;margin:10px 0}
.kv dt{font-weight:900;color:var(--gold2)} .kv dd{margin:0}
.kv a{color:var(--cyan)}
.credits{text-align:center;font-family:var(--kai)}
.credits .big{font-size:clamp(24px,7vw,32px);color:var(--gold2);font-weight:700;margin:14px 0}
.credits .ln{font-size:20px;margin:6px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  @page{size:A4;margin:12mm}
  html{background:#fff}
  #app{max-width:none}
  .cal table{break-inside:avoid}
  .card .tli,.qr,.sblk .sh{break-inside:avoid}
  .card .pgrp{break-inside:auto}
  .card .tl{columns:2;column-gap:24px}
  .card .tli{break-inside:avoid}
  .card h3{break-after:avoid}
  .card .hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cal{overflow:visible}.cal table{min-width:0;font-size:8px}
  .card .tli.past{opacity:.6}
  body{background:#fff;color:#000}.forestbg,.sparks,.hud,#dlg,.noprint,.modal,.reveal{display:none!important}
  #scene{padding:0}.card{box-shadow:none}
}
</style>
</head>

      ({shout:gongGame,shake:flingGame,blow:fireflyGame})[kind]($("#altBox")).then(done)};

      <button class="btn sub block" id="cAlt" style="margin-top:8px">🎮 改玩：${ALT[kind][0]}</button>`;

    function cleanup(){cancelAnimationFrame(raf);mic&&mic.stop();onMotion&&window.removeEventListener("devicemotion",onMotion)}
    const set=x=>{v=Math.min(1,x+1e-9);$("#mt").style.width=(v*100)+"%";if(v>=.999&&!fin){fin=true;cleanup();done()}};

        let last=0;onMotion=e=>{const a=e.accelerationIncludingGravity||e.acceleration;if(!a||a.x===null)return;moved=true;const m=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);const now=performance.now();viz(m/60);if(m>32&&now-last>180){last=now;set(v+.12);vib(30)}};

        setTimeout(()=>{if(!moved&&!fin)fail("偵測不到搖晃，我們改玩這個！")},2500);return;

      el.addEventListener("pointerdown",e=>{drag=true;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId)});
      el.addEventListener("pointermove",e=>{if(!drag)return;dx=e.clientX-sx;dy=e.clientY-sy;el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/8}deg)`});
      el.addEventListener("pointerup",()=>{if(!drag)return;drag=false;if(Math.hypot(dx,dy)>70)gone(dx||60,dy);else{el.style.transform="";Snd.page()}dx=dy=0});
      el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();gone(80,-20)}});
    });
  });
}
/* 替代遊戲 3：點亮螢火蟲 */
function fireflyGame(box){
  return new Promise(res=>{
    box.innerHTML=`<div class="ffield" id="ff"><canvas id="ffc"></canvas></div><p style="text-align:center">✨ <b id="fc">0</b>／8</p>`;
    const ff=$("#ff"),cv=$("#ffc"),r=ff.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
    cv.width=r.width*dpr;cv.height=r.height*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);
    x.fillStyle="rgba(170,175,215,.92)";x.fillRect(0,0,r.width,r.height);
    for(let i=0;i<40;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.2})`;x.beginPath();x.arc(Math.random()*r.width,Math.random()*r.height,20+Math.random()*40,0,7);x.fill()}
    x.globalCompositeOperation="destination-out";
    let n=0,end=false;

      const px=10+Math.random()*80,py=12+Math.random()*76;b.style.left=px+"%";b.style.top=py+"%";ff.appendChild(b);
      const t=setTimeout(()=>b.remove(),1700);

        const g=x.createRadialGradient(px/100*r.width,py/100*r.height,0,px/100*r.width,py/100*r.height,90);g.addColorStop(0,"rgba(0,0,0,1)");g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.fillRect(0,0,r.width,r.height);

const TODAY=new Date();TODAY.setHours(0,0,0,0);
const shift=iso=>{if(!iso)return null;const d=new Date(iso+"T00:00:00");d.setFullYear(d.getFullYear()+CYCLE_SHIFT);return d};
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
const days=(a,b)=>Math.round((b-a)/864e5);
const evs=id=>PATHS[id].events.map(e=>({s:shift(e[0]),e:shift(e[1]||e[0]),t:e[2]}));
function nextEv(id){
  for(const ev of evs(id)){
    if(TODAY<ev.s)return{ev,msg:`距離「${ev.t}」還有 <b>${days(TODAY,ev.s)}</b> 天`};

function eli(id){

    if(comp)return["g","綜合高中學生（學術或專門學程）都可以參加。"];
    if(voc&&p.art)return["g","高職藝術群學生也可以參加。"];
    return["r","限普通科、綜合高中、藝術群。你的主戰場在統測和免試管道！"];
   case "apply":

    if(comp&&p.cred==="yes")return["g","綜合高中修畢專門學程科目 25 學分以上，可以參加。"];
    if(comp&&p.cred==="unk")return["y","綜合高中要修畢專門學程科目 25 學分以上才能報名，請向學校確認學分。"];
    if(comp)return["r","綜合高中要修畢專門學程科目 25 學分以上才能報名；你可以走學測、登記分發等其他管道。"];
    if(gen&&!now)return["g","普通科畢業滿 1 年可以參加。"];
    if(gen&&p.cross==="yes")return["y","跨選專業群科達 25 學分可比照綜高生，需學校認定。"];
    return["r","普通科應屆生還不能報名；畢業滿 1 年後就可以。"];
   case "union":
    if(voc)return["g","專業群科學生可以參加。"];
    if(comp)return["g","綜合高中學生（學術或專門學程）都可以參加。"];
    if(gen&&!now)return["g","普通科畢業滿 1 年可以參加。"];
    return["r","普通科應屆生還不能登記；畢業滿 1 年後就可以。"];
   case "star":
    if(!now)return["r","科技繁星只限應屆畢業生。"];
    if(gen)return["r","科技繁星推薦的是專業群科和綜高專門學程，不含普通科。"];
    if(comp&&p.cred==="no")return["r","綜合高中要修畢專門學程科目 25 學分以上，才能被推薦。"];
    if(p.rank==="yes")return[comp&&p.cred!=="yes"?"y":"g","在校成績前 30%，記得向學校爭取校內推薦！"];
    if(p.rank==="maybe")return["y","就在 30% 邊緣！高三上的成績很關鍵，衝一把。"];
    return["r","需要在校成績科（組）前 30%，且三年都在同一所學校。"];
   case "skillrev":
    if(sk.has("cert2")||sk.has("contest")||sk.has("comp"))return["g","發現技能資格！證照或競賽得獎都能報名。"];
    if(sk.has("c3"))return["r","丙級還差一步，拚到乙級就能打開這扇門！"];
    return["r","需要乙級以上技術士證、專技普考，或技藝技能競賽得獎。"];
   case "special":
    if(sp.has("youth"))return["g","你可以報名「青年儲蓄帳戶組」！"];
    if(sp.has("talent")||sp.has("exp"))return["g","你可能符合「技職特才及實驗教育組」，請對照正修各系訂的報名條件！"];

   case "sport":
    return sp.has("sport")?["g","你的運動成績可能符合資格，請對照簡章認定項目。"]:["r","需要運動相關資格（例：全國性賽事得名）。"];
   case "solo":return["g","高中職畢業生都可以報名，普通科應屆生也可以。"];
   case "industry":
    if(p.coop==="yes")return["g","你可能已經站在一條很特別的升學道路上！"];

/* 自拍：三種方式擇一（遊戲內相機／手機相機／相簿），回傳裁切好的圖片 */
function takeSelfie(box){
  return new Promise(res=>{
    const live=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.isSecureContext);
    box.innerHTML=`<h2>📷 自拍當探險家</h2><p class="small muted">任選一種方式。照片只留在你的手機畫面上，不會上傳。</p>
     <div class="camopts">${live?`<button class="btn" id="liveBtn">📸 開啟相機自拍</button>`:""}
      <label class="btn ${live?"sub":""}" for="camIn">📷 用手機相機拍</label>
      <label class="btn sub" for="galIn">🖼️ 從相簿選一張</label>
      <button class="btn sub" id="camBack">↩ 回去選動物</button>
      <p class="small muted" id="camMsg" style="margin:0"></p></div>`;
    const crop=src=>{const c=document.createElement("canvas"),z=240,w=src.videoWidth||src.naturalWidth,h=src.videoHeight||src.naturalHeight,sz=Math.min(w,h);c.width=c.height=z;
      const x=c.getContext("2d");if(src.videoWidth){x.translate(z,0);x.scale(-1,1)}x.drawImage(src,(w-sz)/2,(h-sz)/2,sz,sz,0,0,z,z);return c.toDataURL("image/jpeg",.82)};
    const fromFile=inp=>{const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
      const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>res(crop(img));
        img.onerror=()=>{$("#camMsg").textContent="這張照片的格式讀不到 😢 請換一張，或改用其他方式。"};img.src=rd.result};rd.readAsDataURL(f)};
    $("#camIn").onchange=()=>fromFile($("#camIn"));$("#galIn").onchange=()=>fromFile($("#galIn"));
    $("#camBack").onclick=()=>{Snd.page();res(null)};
    const lb=$("#liveBtn");
    if(lb)lb.onclick=async()=>{
      Snd.sel();let st;
      try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:640}},audio:false})}
      catch(e){$("#camMsg").textContent="相機沒有開啟（可能沒有允許權限），請改用下面的方式 👇";return}
      openModal(`<div style="text-align:center"><h2>📸 自拍時間</h2><video class="camv" id="camV" playsinline autoplay muted></video>
        <div class="row" style="margin-top:12px"><button class="btn sub" id="mclose">取消</button><button class="btn" id="snap">📸 拍照</button></div></div>`);
      const v=$("#camV");v.srcObject=st;try{await v.play()}catch(e){}
      const stop=()=>{st.getTracks().forEach(t=>t.stop());closeModal()};
      $("#mclose").onclick=stop;
      $("#snap").onclick=()=>{if(!v.videoWidth)return;const url=crop(v);Snd.spell();vib(40);stop();res(url)};
    };
  });
}

const BACK="__back";
function snap(){const o={};for(const k in S.p)o[k]=S.p[k]instanceof Set?new Set(S.p[k]):S.p[k];return o}
function resolveType(){const p=S.p;if(p.type==="vgen"){p.type="gen";p.vgen=true}
  if(p.type==="unk"&&p.h1==="y")p.type="comp";if(p.type==="unk"&&p.h2==="y")p.type="voc";if(p.type==="unk"&&p.h2==="n")p.type="gen"}
const CHEER=["很好！","收到！","了解～","繼續加油！","快完成了！"];
async function scan(){
  S.p={};const hist=[];let qi=0;clear();
  while(qi<QS.length){
    const q=QS[qi];
    if(q.when&&!q.when(S.p)){qi++;continue}
    const vis=QS.filter(x=>!x.when||x.when(S.p));const idx=vis.indexOf(q)+1;
    scene.innerHTML=`<section class="win"><h2>第一章　我是誰？</h2><p class="muted small">身分偵測 ${idx}／${vis.length}</p>
      <div class="hp" style="border-color:var(--cyan)"><i style="width:${(idx-1)/vis.length*100}%;background:var(--cyan)"></i></div></section>`;
    const pre=idx>1&&idx%3===1?CHEER[(idx/3|0)%CHEER.length]:"";
    const v=await ask("guide",(pre?pre+" ":"")+q.q,q.opts,{multi:!!q.multi,back:hist.length?BACK:null});
    if(v===BACK){const h=hist.pop();qi=h[0];S.p=h[1];continue}
    hist.push([qi,snap()]);S.p[q.k]=v;resolveType();qi++;hud();
  }
  power(10);Snd.ok();
  await statusCard();
}

function wipeFog(){
  return new Promise(res=>{
    const box=$("#mapbox"),cv=$("#fog"),tip=$("#fogtip"),r=box.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
    cv.width=r.width*dpr;cv.height=r.height*dpr;const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
    const g=ctx.createLinearGradient(0,0,0,r.height);g.addColorStop(0,"#C9C6DE");g.addColorStop(1,"#9C98BC");ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);
    for(let i=0;i<60;i++){ctx.fillStyle=`rgba(255,255,255,${Math.random()*.25})`;ctx.beginPath();ctx.arc(Math.random()*r.width,Math.random()*r.height,20+Math.random()*50,0,7);ctx.fill()}
    ctx.globalCompositeOperation="destination-out";
    let down=false,last=null,done=false,cnt=0;
    const pt=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
    const brush=p=>{ctx.lineWidth=58;ctx.lineCap="round";ctx.beginPath();ctx.moveTo((last||p).x,(last||p).y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;if(++cnt%6===0){Snd.whoosh(0,.2,.04,600,1400);check()}};
    const check=()=>{const d=ctx.getImageData(0,0,cv.width,cv.height).data;let cl=0,tot=0;for(let i=3;i<d.length;i+=4*97){tot++;if(d[i]<40)cl++}if(cl/tot>.5)finish()};
    const finish=()=>{if(done)return;done=true;cv.style.opacity=0;cv.style.pointerEvents="none";Snd.sparkle();vib(60);setTimeout(()=>{cv.remove();res()},800)};
    cv.addEventListener("pointerdown",e=>{down=true;last=null;cv.setPointerCapture(e.pointerId);tip.style.opacity=0;brush(pt(e))});
    cv.addEventListener("pointermove",e=>{if(down)brush(pt(e))});
    ["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>{down=false;last=null}));
    const sk=document.createElement("button");sk.className="btn sub";sk.textContent="用按的撥開迷霧";sk.style.cssText="position:absolute;right:10px;bottom:10px;padding:6px 12px;font-size:13px";box.appendChild(sk);
    sk.onclick=()=>{sk.remove();finish()};
    const _r=res;res=()=>{sk.remove();_r()};
  });
}

const isNight=id=>id==="night";
function cands(){
  const c=ORDER_IDS.filter(id=>eli(id)[0]!=="r");
  if(S.p.mode==="work")return c;
  return c.filter(x=>!isNight(x)).concat(c.filter(isNight)); // 沒選晚上上課：進修部排最後
}
function autoStrat(){
  const fs=id=>evs(id)[0].s,mode=S.p.mode;
  let c=ORDER_IDS.filter(id=>eli(id)[0]!=="r").sort((a,b)=>ORD[eli(a)[0]]-ORD[eli(b)[0]]||(fit(b)+(S.tickets[b]?.3:0))-(fit(a)+(S.tickets[a]?.3:0))||fs(a)-fs(b));
  if(mode==="work"){const a=c.includes("night")?"night":c[0];const rest=c.filter(x=>x!==a);return{a,b:rest.find(x=>x!=="solo")||rest[0]||"",c:rest.includes("solo")?"solo":(rest[1]||"")}}
  if(mode==="biz"&&c.includes("industry")){const day=c.filter(x=>x!=="industry"&&!isNight(x));return{a:"industry",b:day.find(x=>x!=="solo")||"",c:day.includes("solo")?"solo":(day[1]||"")}}
  const day=c.filter(x=>!isNight(x)&&x!=="industry");
  const a=day.find(x=>x!=="solo")||day[0]||c[0];
  const cc=day.includes("solo")&&a!=="solo"?"solo":(day.find(x=>x!==a)||"");
  const b=day.find(x=>x!==a&&x!==cc)||c.find(x=>x!==a&&x!==cc&&!isNight(x))||c.find(x=>x!==a&&x!==cc)||"";
  return{a,b,c:cc};
}
function warnings(){

      <b class="small" style="display:block;margin-top:8px">🗓️ 完整時間軸（預估）</b>${timelineHTML(id)}</div>`}).join("")||"尚未選擇"}
    <div class="pgrp"><b>📅 每個月提醒自己</b><div class="checks"><label><input type="checkbox"> 注意每條管道的報名日期</label></div></div>
    <h3>⏰ 我的行動時間</h3>${first?`<p style="background:#FBEFC8;border-radius:8px;padding:6px 10px"><b>下一步：</b>${PATHS[first.id].tk}，${first.n.msg}</p>`:""}
    <p class="small">現在確認資格 → 準備資料 → 報名期間完成報名 → 依管道完成甄試／選填／報到</p>
    <div class="cal"><table><thead><tr><th>管道</th>${MONTHS.map(m=>`<th class="${m===curM?"now":""}">${m}月${m===curM?"<br>現在":""}</th>`).join("")}</tr></thead><tbody>
     ${st.map((id,i)=>`<tr><td class="lab">${med[i].slice(0,2)} ${PATHS[id].tk}</td>${MONTHS.map(m=>`<td>${evs(id).filter(e=>e.s.getMonth()+1===m).map(e=>`<span class="mk" style="background:${PATHS[id].color}">${e.t}</span>`).join("")}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div><p class="small" style="color:#6B5A3C">${CYCLE_LABEL}</p>
    <h3>📱 掃描查看招生資訊</h3><div class="qrs"><div class="qr">${QR[CSU.line]||""}💬 正修 LINE@（有問題直接問）<br><a href="${CSU.line}" target="_blank" rel="noopener">ID：${CSU.lineId}</a></div><div class="qr">${QR[CSU.url]||""}正修招生資訊網<br><a href="${CSU.url}" target="_blank" rel="noopener">${CSU.url}</a></div>
     ${[...new Set(st.map(id=>PATHS[id].url))].filter(u=>u!==CSU.url).map(u=>{const id=st.find(x=>PATHS[x].url===u);return`<div class="qr">${QR[u]||""}${PATHS[id].tk}<br><a href="${u}" target="_blank" rel="noopener">${u}</a></div>`}).join("")}</div>
    <p class="small" style="margin-top:8px">☎️ 正修招生處 ${CSU.tel}<br>📍 ${CSU.addr}</p>
    <p class="disc">日期依${CYCLE_LABEL}，以民國年表示；製作日期 ${dw(TODAY)}。招生日期與規定可能調整，請以當年度官方招生簡章為準。</p>
   </div></article>
   <section class="win noprint" style="margin-top:14px"><div class="row"><button class="btn sub" id="pr">🖨️ 下載 PDF／列印</button><button class="btn" id="toEnd">完成冒險 ✦</button></div></section>`;
  $("#pr").onclick=()=>window.print();
  await tap($("#toEnd"));
  await ending();
}

/* ===================== 結局 ===================== */
async function ending(){
  clear();Snd.setTheme("end");
  if(!S.done){S.done=true;store.set(PLAYS_KEY,String(plays()+1))}save();hud();
  const t=ORDER_IDS.filter(id=>S.tickets[id]);
  scene.innerHTML=`<section class="win credits"><h2>🎓 冒險完成</h2>${t.map(id=>ticketHTML(id,true)).join("")}</section>`;
  const bind=()=>scene.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>viewTicket(b.dataset.view));bind();
  await say([["guide","恭喜你！你今天不只是玩了一場遊戲。"],["guide","你完成的是一場「升學路線探索任務」。我真的以你為榮！"],["me","原來我不只有一條路可以走！"]]);
  scene.insertAdjacentHTML("beforeend",`<section class="win credits appear"><p class="big">你的未來，不只有一條路。</p>
    <p class="ln">先了解資格，再選擇道路。</p><p class="ln">能提早準備，就不要等到最後。</p>
    <p class="ln" style="color:var(--cyan)">越早知道自己能走哪條路，就越早拿到升學主動權！</p>
    <p style="margin-top:14px"><b>正修科技大學</b><br>找到適合你的升學路，現在，就開始探索。</p>
    <div style="display:grid;gap:10px;margin-top:12px">
     <button class="btn sub" id="e1">🔄 重新探索</button><button class="btn" id="e2">🏆 查看我的升學攻略卡</button>
     <a class="btn sub" href="${CSU.url}" target="_blank" rel="noopener">🌐 查看正修招生資訊</a><button class="btn sub" id="e3">📱 掃描 QR Code（LINE@ 問問題）</button></div></section>`);
  bind();
  $("#e1").onclick=()=>{if(confirm("重新探索？進度會清除，重玩時可以使用「⏩ 略過」功能。")){store.del(SAVE_KEY);location.reload()}};
  $("#e2").onclick=()=>cardView();
  $("#e3").onclick=()=>openModal(`<div style="text-align:center"><h2>📱 掃描 QR Code</h2>
    <div class="row" style="align-items:flex-start"><div style="flex:1;min-width:140px"><div class="qrbig">${QR[CSU.line]||""}</div><p><b>💬 正修 LINE@ 官方帳號</b><br><span class="small">有問題直接問（一對一聊天）<br>ID：${CSU.lineId}</span><br><a href="${CSU.line}" target="_blank" rel="noopener" style="color:var(--cyan)">加入好友</a></p></div>
    <div style="flex:1;min-width:140px"><div class="qrbig">${QR[CSU.url]||""}</div><p><b>🌐 正修招生資訊網</b><br><a href="${CSU.url}" target="_blank" rel="noopener" style="color:var(--cyan);word-break:break-all">${CSU.url}</a></p></div></div>
    <p class="small">☎️ ${CSU.tel}</p></div><button class="btn block" id="mclose">關閉</button>`);
}

title();
})();
</script>
</body>
